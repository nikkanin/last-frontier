<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ПОСЛЕДНИЙ РУБЕЖ — прототип</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101719;color:#e8eee9;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none}
.stat{background:#101a1dcc;border:1px solid #71817a66;border-radius:8px;padding:7px 10px;font-size:12px;min-width:82px}
.stat b{display:block;font-size:14px;margin-top:3px;color:#d6e4d8}
#hint{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#101a1dcc;padding:8px 12px;border-radius:8px;font-size:12px;text-align:center;pointer-events:none;max-width:85vw}
#stick{position:fixed;left:22px;bottom:28px;width:118px;height:118px;border-radius:50%;background:#c9d6d022;border:1px solid #d5e0dc66}
#nub{position:absolute;width:48px;height:48px;left:34px;top:34px;border-radius:50%;background:#dce7df66;border:1px solid #e6eee8aa}
#actions{position:fixed;right:18px;bottom:28px;display:flex;flex-direction:column;gap:10px}
button{border:1px solid #aebdb366;background:#15221fe8;color:#f1f5f0;border-radius:10px;padding:13px 16px;font-weight:bold;letter-spacing:.04em}
#inventory{display:none;position:fixed;inset:15% 8%;background:#101a1af2;border:1px solid #9aaca0;border-radius:14px;padding:18px;overflow:auto}
#inventory h2{margin:0 0 12px;font-size:18px}#items{line-height:1.9;font-size:14px}
#close{margin-top:14px}
#cross{position:fixed;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#e8eee9aa}
#cross:before{left:5px;top:0;width:2px;height:12px}#cross:after{left:0;top:5px;width:12px;height:2px}
@media(min-width:800px){#stick{width:140px;height:140px}#nub{left:45px;top:45px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="game"></div><div id="cross"></div>
<div id="hud">
 <div class="stat">ЗДОРОВЬЕ<b id="health">100</b></div>
 <div class="stat">ГОЛОД<b id="hunger">100</b></div>
 <div class="stat">ЖАЖДА<b id="thirst">100</b></div>
</div>
<div id="hint">Разведайте улицу. Подойдите к предмету и нажмите «ВЗЯТЬ».</div>
<div id="stick"><div id="nub"></div></div>
<div id="actions"><button id="take">ВЗЯТЬ</button><button id="bag">СУМКА</button></div>
<div id="inventory"><h2>СУМКА</h2><div id="items">Пока пусто</div><button id="close">ЗАКРЫТЬ</button></div>
<script type="module">
import * as THREE from 'three';
const root=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78827d);scene.fog=new THREE.Fog(0x78827d,18,75);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,150);camera.position.set(0,1.7,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9d4ce,0x303a34,2));
const sun=new THREE.DirectionalLight(0xffe6c2,2.1);sun.position.set(-8,15,7);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x343d38));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,100),mat(0x242b2a));road.rotation.x=-Math.PI/2;road.position.set(0,.015,-24);scene.add(road);
function block(x,z,w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
for(let i=0;i<9;i++){let z=-i*9-5;block(-11,z,8,5+Math.random()*5,7,0x59615b);block(11,z-3,8,6+Math.random()*4,8,0x4b5550)}
for(let i=0;i<24;i++){let x=(Math.random()>.5?1:-1)*(7+Math.random()*18),z=5-Math.random()*75;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,2,6),mat(0x3c3028));trunk.position.set(x,1,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.3,1),mat(0x394b3d));crown.position.set(x,2.5,z);crown.scale.y=1.2;scene.add(crown)}
// abandoned car
block(-3,.5,2.4,1.1,4,0x424b4c).position.y=.65;
const loot=[];
function item(name,x,z,color){const mesh=new THREE.Mesh(new THREE.BoxGeometry(.35,.45,.3),mat(color));mesh.position.set(x,.35,z);mesh.castShadow=true;scene.add(mesh);loot.push({name,mesh})}
item('Бутылка воды',1,1,0x5b9da0);item('Консервы',-1,-5,0x9b8054);item('Бинты',2,-12,0xd8d5c8);item('Металлолом',-2,-18,0x858b85);
const inventory=[];let health=100,hunger=100,thirst=100;
const keys={x:0,y:0};let yaw=0,pitch=0;const forward=new THREE.Vector3(),right=new THREE.Vector3();
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let stickId=null,lookId=null,lastX=0,lastY=0;
function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=42,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}keys.x=dx/max;keys.y=dy/max;nub.style.transform='translate('+dx+'px,'+dy+'px)'}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});
function releaseStick(e){if(e.pointerId===stickId){stickId=null;keys.x=keys.y=0;nub.style.transform='translate(0,0)'}}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.42)return;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(lookId)});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;pitch=Math.max(-1.1,Math.min(1.1,pitch-dy*.003));});
renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});
document.querySelector('#take').onclick=()=>{let target=null,best=2.5;for(const l of loot){let d=camera.position.distanceTo(l.mesh.position);if(d<best){best=d;target=l}}if(target){inventory.push(target.name);scene.remove(target.mesh);loot.splice(loot.indexOf(target),1);document.querySelector('#hint').textContent='Подобрано: '+target.name;updateBag()}else document.querySelector('#hint').textContent='Рядом нет предметов для подбора'};
function updateBag(){document.querySelector('#items').innerHTML=inventory.length?inventory.map((v,i)=>(i+1)+'. '+v).join('<br>'):'Пока пусто'}
const panel=document.querySelector('#inventory');document.querySelector('#bag').onclick=()=>{updateBag();panel.style.display='block'};document.querySelector('#close').onclick=()=>panel.style.display='none';
let last=performance.now(),elapsed=0;
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;
yaw+=0;camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);
forward.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));
const speed=4.2;camera.position.addScaledVector(forward,-keys.y*speed*dt);camera.position.addScaledVector(right,keys.x*speed*dt);camera.position.y=1.7;
camera.position.x=THREE.MathUtils.clamp(camera.position.x,-35,35);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-85,12);
if(elapsed>8){hunger=Math.max(0,hunger-dt*.055);thirst=Math.max(0,thirst-dt*.085);if(hunger===0||thirst===0)health=Math.max(0,health-dt*.2)}
document.querySelector('#health').textContent=Math.round(health);document.querySelector('#hunger').textContent=Math.round(hunger);document.querySelector('#thirst').textContent=Math.round(thirst);
renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
