let last=performance.now(),elapsed=0;function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);forward.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));let speed=stanceSpeeds[stance];camera.position.addScaledVector(forward,-keys.y*speed*dt);camera.position.addScaledVector(right,keys.x*speed*dt);camera.position.y=1.7;camera.position.x=THREE.MathUtils.clamp(camera.position.x,-4.4,4.4);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-105,10);const moving=Math.hypot(keys.x,keys.y)>.12;currentNoise=moving?Math.min(100,(12+gearNoise()*2.2+stance*0)*stanceNoise[stance]+Math.hypot(keys.x,keys.y)*18*stanceNoise[stance]):Math.min(100,gearNoise()*1.4);document.querySelector('#noiseValue').textContent=Math.round(currentNoise)+'%';document.querySelector('#noiseFill').style.width=currentNoise+'%';document.querySelector('#noiseFill').style.background=currentNoise>65?'#bd6555':currentNoise>30?'#c9b36b':'#7eaa82';const nearGym=camera.position.distanceTo(new THREE.Vector3(0,1.7,-94))<7;gymButton.disabled=!nearGym||gymTrained;gymButton.textContent=gymTrained?'ЗАЛ ПРОЙДЕН':'ТРЕНИРОВКА';if(nearGym&&!gymTrained)document.querySelector('#hint').textContent='ПОДПОЛЬНЫЙ ЗАЛ · тренировка увеличит лимит веса на 5 кг';if(elapsed>8){hunger=Math.max(0,hunger-dt*.035);thirst=Math.max(0,thirst-dt*.055);if(hunger===0||thirst===0)health=Math.max(0,health-dt*.15)}document.querySelector('#health').textContent=Math.round(health);document.querySelector('#hunger').textContent=Math.round(hunger);document.querySelector('#thirst').textContent=Math.round(thirst);renderer.render(scene,camera)}requestAnimationFrame(animate);
